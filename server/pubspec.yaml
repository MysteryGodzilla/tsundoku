name: tsundoku_server
description: "The Tsundoku sync server. It stores accounts and locked boxes; it can never read a library."
publish_to: none
version: 0.2.0
# repository: https://github.com/my_org/my_repo

environment:
  sdk: ^3.14.0

# Add regular dependencies here.
dependencies:
  crypto: ^3.0.8
  path: ^1.9.0
  shelf: ^1.4.3
  shelf_router: ^1.1.5
  sqlite3: ^3.9.1
  tsundoku_protocol:
    path: ../packages/tsundoku_protocol

dev_dependencies:
  http: ^1.6.0
  lints: ^6.0.0
  test: ^1.25.6
